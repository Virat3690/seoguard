[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "seoguard"
version = "0.1.0"
description = "Async SEO crawler: fetch URLs, extract SEO signals, store results in SQLite."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "selectolax>=1.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
seoguard = "seoguard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/seoguard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
